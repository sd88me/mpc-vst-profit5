# Builds Profit-5 for Gen1 (armv7) and Gen2 (aarch64), packages both zips with mpc-vst-plugins' release.py and attaches them to a DRAFT
# release. A person installs that exact zip on a device and publishes the draft (mpc-vst-plugins docs/RELEASING.md).
name: Release (draft)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, e.g. 0.1.0
        required: true
        default: "0.1.0"
      dry_run:
        description: Zip and previews as run artifacts only, no draft release
        type: boolean
        default: false

jobs:
  vst:
    uses: sd88me/mpc-vst-plugins/.github/workflows/vst-release.yml@c121b12ae00042115ed98326ac7ccb7ee5ad6151
    permissions: { contents: write }
    with:
      tag: profit-5-vst-v${{ inputs.version }}
      version: ${{ inputs.version }}
      tools_ref: c121b12ae00042115ed98326ac7ccb7ee5ad6151
      vst_dir: vst
      build: vst/build.sh
      host_test: '"$MPC_VST/tools/test_port.sh" vst/vst.json'
      about: "Five-voice analog polysynth modelled on an early SSM-chip Prophet-5: Rev 2 / Rev 4 voicing, 38 factory programs."
      plugin_id: profit-5
      license: MIT
      dry_run: ${{ inputs.dry_run }}
